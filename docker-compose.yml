version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: rag-postgres-docker
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rag-redis-docker
    restart: unless-stopped
    ports:
      - "6380:6379"

  python-ai:
    build:
      context: ./python-ai
    container_name: rag-python-ai-docker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      CHROMA_DIR: /app/chroma_store
      REDIS_URL: redis://redis:6379
      CHAT_MODEL: llama-3.1-8b-instant
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    volumes:
      - chroma_data:/app/chroma_store
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
    container_name: rag-backend-docker
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ragdb?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      PYTHON_AI_TIMEOUT_MS: 30000
    depends_on:
      - postgres
      - redis
      - python-ai

  frontend:
    build:
      context: ./frontend
    container_name: rag-frontend-docker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data: